name: Deploy Terraform-Owned Lambda

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: deploy-kj-link-shortener-production
  cancel-in-progress: false

jobs:
  verify_terraform_ownership:
    name: Verify Terraform ownership
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-southeast-1

      - name: Refuse CloudFormation-owned deployment
        run: |
          set -Eeuo pipefail

          if aws cloudformation describe-stacks \
            --stack-name KjLinkShortenerStack \
            --region ap-southeast-1 \
            >/dev/null 2>&1; then
            echo "::error::KjLinkShortenerStack still exists; complete the Terraform takeover before deploying code"
            exit 1
          fi

          role_name="$(aws lambda get-function-configuration \
            --function-name kj-link-shortener \
            --region ap-southeast-1 \
            --query 'Role' \
            --output text | awk -F/ '{print $NF}')"

          aws iam get-role-policy \
            --role-name "${role_name}" \
            --policy-name kj-app-runtime-config-read \
            >/dev/null

  deploy:
    name: Deploy production Lambda
    needs: verify_terraform_ownership
    uses: kaojai-ai/dev-tools/.github/workflows/deploy-lambda-code.yml@main
    permissions:
      contents: read
      packages: read
      id-token: write
    secrets:
      npm_auth_token: ${{ secrets.NPM_TOKEN_GITHUB || secrets.NPM_AUTH_TOKEN || github.token }}
      KJPROD_AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      GRAFANA_TOKEN_FOR_GITHUB: ${{ secrets.GRAFANA_TOKEN_FOR_GITHUB }}
    with:
      environment: production
      app_directory: .
      entry: src/runtime-handler.ts
      function_name: kj-link-shortener
      function_alias: production
      sanitize_environment: true
      aws_region: ap-southeast-1
      service_name: kj-link-shortener
      function_url_health_path: /health
      function_url_health_mode: http_2xx
      node_version: "20"

  prune_versions:
    name: Prune old Lambda versions
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout dev-tools deploy helpers
        uses: actions/checkout@v6
        with:
          repository: kaojai-ai/dev-tools
          ref: main
          path: .dev-tools
          token: ${{ secrets.BYPASS_DEPLOYMENT_GITHUB_TOKEN || github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-southeast-1

      - name: Prune
        run: |
          node .dev-tools/.github/scripts/prune-lambda-versions.mjs \
            --function-name kj-link-shortener \
            --region ap-southeast-1 \
            --retain-count 10 \
            --retain-days 14
